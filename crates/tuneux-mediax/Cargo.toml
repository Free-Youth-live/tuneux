[package]
name = "tuneux-mediax"
version = "0.1.0"
edition = "2021"
license = "MulanPSL-2.0"
authors = ["不羁的青春（FreeYouth）"]
description = "tuneux 系列共享媒体数据层：m3u 播放列表、书签、歌词数据、元数据提取等（非 UI 的领域逻辑）"
rust-version = "1.88"

[dependencies]
serde.workspace = true
encoding_rs.workspace = true
tuneux-corex = { path = "../tuneux-corex" }

# dev 依赖仅用于冻结表示的契约测试（serde 往返经 toml 验证）
# 与字符池宽度守护（unicode-width 校验），版本随 workspace 统一，不新增供应链。
[dev-dependencies]
toml.workspace = true
unicode-width.workspace = true

[lints]
workspace = true