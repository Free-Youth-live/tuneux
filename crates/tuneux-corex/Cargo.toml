[package]
name = "tuneux-corex"
version = "0.3.0"
edition = "2021"
license = "MulanPSL-2.0"
authors = ["不羁的青春（FreeYouth）"]
description = "tuneux 系列共享音频内核：解码、三线程引擎、播放时钟、无缝状态机（零 UI、零网络、零插件）"
rust-version = "1.88"

[features]
# 测试辅助方法（set_*_for_test），仅供同仓前端测试启用，不进 release
test-helpers = []

[dependencies]
# 纯音频依赖集（禁 UI：ratatui/crossterm/egui 严禁加入；禁网络依赖——规范）
cpal.workspace = true
symphonia.workspace = true
ringbuf.workspace = true
crossbeam-channel.workspace = true
rubato.workspace = true
rustfft.workspace = true
opus-decoder = "0.1.1"
wavicle = "0.1.0"

[lints]
workspace = true
