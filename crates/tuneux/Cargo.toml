[package]
# 包名 tuneux；可执行文件名 tuneux
name = "tuneux"
version = "0.5.5"
edition = "2021"
# 木兰宽松许可证 v2
license = "MulanPSL-2.0"
authors = ["不羁的青春（FreeYouth）"]
# 项目描述
description = "跨平台命令行音乐播放器"
# 最小支持 Rust 版本：ratatui 0.30 要求 1.88+（cpal 0.15 要求 1.85+），此处取高者
rust-version = "1.88"

# 只编译为可执行二进制（非库）
[[bin]]
name = "tuneux"
path = "src/main.rs"

[dependencies]
# 共享音频内核（契约化一等 crate）
tuneux-corex = { path = "../tuneux-corex" }
tuneux-mediax = { path = "../tuneux-mediax" }
# 发行版通用机制：键位解析 / 配置路径 / 媒体键 / 目录浏览内核
#（media-key：基础版需要系统媒体键，显式启用）
tuneux-commonx = { path = "../tuneux-commonx", features = ["media-key"] }
# 依赖版本统一由 workspace 根 [workspace.dependencies] 管理
crossbeam-channel.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
crossterm.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
encoding_rs.workspace = true


[dev-dependencies]
# 测试辅助：corex 的 set_*_for_test 方法（仅测试构建生效，release 不含）
tuneux-corex = { path = "../tuneux-corex", features = ["test-helpers"] }

[lints]
workspace = true
