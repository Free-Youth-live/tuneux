# =============================================================================
# tuneux · 日常检查（push / PR 触发）
#
# 批 0 首推后生效：日常提交的质量兜底（release.yml 只管发布标签触发）。
# 与 release 的 checks job 同口径：fmt / clippy 零告警 / test / 依赖核查，
# 任一不过红叉。
# =============================================================================

name: 日常检查

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 周一定时全量核查（依赖漏洞与撤回版本不等人推送；UTC 19:00 = 京周二 03:00）
    - cron: "0 19 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装系统依赖（ALSA 开发库，cpal 编译需要）
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: 格式检查
        run: cargo fmt --check
      - name: 静态检查（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace
      - name: 依赖核查（advisories / bans / licenses / sources）
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --workspace check

  # Windows 腿：跨平台编译面与「插件验签守卫」——第一方插件 .sig 覆盖
  # manifest 文本字节，行尾随平台漂移会破坏验签，只有
  # Windows 实测跑得出来；单 ubuntu 矩阵对 rdev 媒体键等 Windows 专属
  # 路径零编译覆盖。
  checks-windows:
    name: 质量检查（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 编译检查（全目标全特性）
        run: cargo check --workspace --all-targets --all-features
      - name: 测试（fx 插件验签守卫）
        run: cargo test -p tuneux-fx
