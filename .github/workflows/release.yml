# =============================================================================
# tuneux · 发布构建
#
# 推送版本标签（v*）或手动触发时，为六个平台编译发布二进制并上传到发布页面。
# 平台：Linux x86_64 / Linux arm64、macOS x86_64 / macOS arm64、
#       Windows x86_64 / Windows arm64。
# =============================================================================

name: 发布构建

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 版本标签（如 v0.4.4）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: zip

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 Linux x86_64 依赖
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: 安装 Linux arm64 交叉编译环境
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # 添加 Ubuntu ports 源（提供 arm64 的包）
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe restricted multiverse' | sudo tee /etc/apt/sources.list.d/ports-arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe restricted multiverse' | sudo tee -a /etc/apt/sources.list.d/ports-arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe restricted multiverse' | sudo tee -a /etc/apt/sources.list.d/ports-arm64.list
          # 限制默认源只取 amd64（关键：避免默认源尝试 arm64 导致 404）
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - name: 编译（Linux arm64 交叉）
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} -p tuneux
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig

      - name: 编译
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} -p tuneux

      - name: 打包（Linux / macOS）
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          VER="${TAG#v}"
          cd "target/${{ matrix.target }}/release"
          tar -czf "$OLDPWD/tuneux-${VER}-${{ matrix.name }}.tar.gz" tuneux

      - name: 打包（Windows）
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^v', ''
          Compress-Archive -Path "target/${{ matrix.target }}/release/tuneux.exe" -DestinationPath "tuneux-$ver-${{ matrix.name }}.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tuneux-*.tar.gz
            tuneux-*.zip
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 创建发布并上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "发布已存在，仅上传产物"
          else
            gh release create "$TAG" \
              --title "不羁的青春（FreeYouth）" \
              --notes "这是一个重要的版本更新"
          fi
          gh release upload "$TAG" dist/*/* --clobber

