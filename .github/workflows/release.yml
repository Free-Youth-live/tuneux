# =============================================================================
# tuneux · 发布构建
#
# 推送版本标签（v*）或手动触发时，为六个平台编译发布二进制并上传到发布页面。
# 平台：Linux x86_64 / Linux arm64、macOS x86_64 / macOS arm64、
#       Windows x86_64 / Windows arm64。
#
# 每个平台产出两个压缩包：
# - tuneux-<ver>-<平台>    ：基础版二进制 + 使用手册-tuneux；
# - tuneux-fx-<ver>-<平台> ：插件版二进制 + 使用手册-tuneux-fx + plugins/ 插件目录。
# =============================================================================

name: 发布构建

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 版本标签（如 v0.5.0）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: zip

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建目标
        run: rustup target add ${{ matrix.target }}

      - name: 安装 Linux x86_64 依赖
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: 安装 Linux arm64 交叉编译环境
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # 添加 Ubuntu ports 源（提供 arm64 的包）
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe restricted multiverse' | sudo tee /etc/apt/sources.list.d/ports-arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe restricted multiverse' | sudo tee -a /etc/apt/sources.list.d/ports-arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe restricted multiverse' | sudo tee -a /etc/apt/sources.list.d/ports-arm64.list
          # 限制默认源只取 amd64（关键：避免默认源尝试 arm64 导致 404）
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - name: 编译（Linux arm64 交叉）
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} -p tuneux -p tuneux-fx
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig

      - name: 编译
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} -p tuneux -p tuneux-fx

      - name: 打包（Linux / macOS）
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          # 版本号剥 v 前缀：v0.5.0 → 0.5.0（文件名用纯版本号）
          VER="${TAG#v}"
          VER="${VER%%-*}"
          BIN="target/${{ matrix.target }}/release"

          # 基础版：二进制 + 使用手册
          mkdir -p pkg/tuneux
          cp "$BIN/tuneux" pkg/tuneux/
          cp 使用手册-tuneux.txt pkg/tuneux/
          # 手册首行注入版本号：__VERSION__ → 实际版本（来自 tag）
          sed -i.bak "s/__VERSION__/${VER}/" "pkg/tuneux/使用手册-tuneux.txt" && rm -f "pkg/tuneux/使用手册-tuneux.txt.bak"
          tar -czf "tuneux-${VER}-${{ matrix.name }}.tar.gz" -C pkg/tuneux .

          # 插件版：二进制 + 使用手册 + plugins/ 插件目录
          mkdir -p pkg/tuneux-fx
          cp "$BIN/tuneux-fx" pkg/tuneux-fx/
          cp 使用手册-tuneux-fx.txt pkg/tuneux-fx/
          sed -i.bak "s/__VERSION__/${VER}/" "pkg/tuneux-fx/使用手册-tuneux-fx.txt" && rm -f "pkg/tuneux-fx/使用手册-tuneux-fx.txt.bak"
          cp -R plugins pkg/tuneux-fx/plugins
          tar -czf "tuneux-fx-${VER}-${{ matrix.name }}.tar.gz" -C pkg/tuneux-fx .

      - name: 打包（Windows）
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          # 版本号剥 v 前缀：v0.5.0 → 0.5.0（文件名用纯版本号）
          $ver = $env:TAG -replace '^v', '' -replace '-.*$', ''
          $bin = "target/${{ matrix.target }}/release"

          # 基础版：二进制 + 使用手册
          New-Item -ItemType Directory -Force -Path pkg/tuneux | Out-Null
          Copy-Item "$bin/tuneux.exe" pkg/tuneux/
          Copy-Item 使用手册-tuneux.txt pkg/tuneux/
          $m = Get-Content "pkg/tuneux/使用手册-tuneux.txt" -Raw
          Set-Content "pkg/tuneux/使用手册-tuneux.txt" -Value ($m -replace '__VERSION__', $ver) -NoNewline -Encoding UTF8
          Compress-Archive -Path pkg/tuneux/* -DestinationPath "tuneux-$ver-${{ matrix.name }}.zip"

          # 插件版：二进制 + 使用手册 + plugins/ 插件目录
          New-Item -ItemType Directory -Force -Path pkg/tuneux-fx | Out-Null
          Copy-Item "$bin/tuneux-fx.exe" pkg/tuneux-fx/
          Copy-Item 使用手册-tuneux-fx.txt pkg/tuneux-fx/
          $m = Get-Content "pkg/tuneux-fx/使用手册-tuneux-fx.txt" -Raw
          Set-Content "pkg/tuneux-fx/使用手册-tuneux-fx.txt" -Value ($m -replace '__VERSION__', $ver) -NoNewline -Encoding UTF8
          Copy-Item -Recurse plugins pkg/tuneux-fx/plugins
          Compress-Archive -Path pkg/tuneux-fx/* -DestinationPath "tuneux-fx-$ver-${{ matrix.name }}.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tuneux-*.tar.gz
            tuneux-fx-*.tar.gz
            tuneux-*.zip
            tuneux-fx-*.zip
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 创建发布并上传
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "发布已存在，仅上传产物"
          else
            gh release create "$TAG" \
              --title "不羁的青春（FreeYouth）" \
              --notes "这是一个重要的版本更新"
          fi
          gh release upload "$TAG" dist/*/* --clobber

